<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokerSense · AA 冻结回放</title>
<style>
body{font:15px/1.6 system-ui,sans-serif;background:#101920;color:#e0eaf0;margin:0}main{max-width:1100px;margin:auto;padding:26px}h1{margin:0;font-size:27px}header,panel{display:block;background:#192833;padding:20px;border-radius:12px;margin-bottom:18px}small,.muted{color:#a5bdca}code{overflow-wrap:anywhere;color:#94dacc}button,input{font:inherit}button{border:1px solid #5e8499;background:#243e4e;color:white;padding:7px 15px;border-radius:6px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #70dbcf}input[type=range]{width:100%;accent-color:#70dbcf}input[type=number]{width:90px;padding:6px}nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.status{padding:8px 12px;background:#243c44;border-left:3px solid #67c7b3;margin:10px 0}table{width:100%;border-collapse:collapse;background:#172630}th,td{text-align:left;vertical-align:top;padding:9px;border-bottom:1px solid #304653}th{color:#9fbdcd}td:nth-child(2){min-width:100px;color:#a6e3d8}.missing{color:#ffd88a}#error{color:#ffb5ac}details{margin-top:12px}#frameLabel{font-size:20px;font-weight:700}
</style>
<main><header><small>PokerSense / AA 离线观察</small><h1>冻结识别结果回放</h1><p>仅显示已有结果 · 九个视觉槽位 · 没有实时采集或策略建议</p><code>strategy_eligible = false</code></header>
<panel><nav><button id="prev">上一帧</button><button id="play">播放</button><button id="next">下一帧</button><label>跳转帧 <input id="jump" type="number" min="0" max="1800" value="0"></label><button id="go">跳转</button><span id="frameLabel">加载中</span></nav><input id="slider" aria-label="帧位置" type="range" min="0" max="1800" value="0"><small>左右方向键逐帧；播放速度10帧/秒，用于查看结果，不表示采集延迟。</small>
<div class="status missing">未实现：pot · seat_presence · current_actor · 完整动作 · 特殊模式</div><div id="error" role="alert"></div><div class="status" id="participation"></div><div class="status" id="invalidity"></div><div id="scene"></div>
<details open><summary>画面来源与证据</summary><div>来源视频 SHA：<code id="source"></code></div><div>冻结结果 SHA：<code id="replay"></code></div><small>此页不加载原始录像。当前值来自逐帧日志；日志未记录的置信度或细分原因会明确标注“未记录”。</small></details></panel>
<table><thead><tr><th>字段</th><th>当前值</th><th>状态</th><th>置信／原因</th></tr></thead><tbody id="fields"></tbody></table></main>
<script src="/app.js"></script></html>
