<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>PokerSense</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main id="app" data-phase="connecting">
  <header class="header">
    <div class="brand">
      <span class="dot pending" id="conn-dot" aria-hidden="true"></span>
      <span class="brand-label" id="conn-label" role="status" aria-live="polite">PokerSense</span>
    </div>
    <div class="header-actions">
      <div class="street-badge" id="street-badge" data-empty="true">—</div>
      <button class="settings-button control" id="settings-button" type="button" aria-label="Settings">
        <span aria-hidden="true">⚙</span>
      </button>
    </div>
  </header>

  <div class="status-banner" id="status-banner" role="status" aria-live="polite" data-tone="info" hidden></div>

  <section class="table-panel" aria-label="Table">
    <div class="card-row">
      <span class="label field-label" data-i18n="board">Board</span>
      <div class="card-slots" id="board-slots"></div>
    </div>
    <div class="card-row">
      <span class="label field-label" data-i18n="hero">Hero</span>
      <div class="card-slots" id="hero-slots"></div>
    </div>
    <div class="pot-row">
      <span class="label field-label" data-i18n="pot">Pot</span>
      <span class="value unknown" id="pot-value">—</span>
    </div>
  </section>

  <section class="equity-panel" aria-label="Equity">
    <div class="equity-headline">
      <div>
        <div class="win-label" data-i18n="winRate">Win Rate</div>
        <div class="win idle" id="win-rate">—</div>
      </div>
      <div class="equity-secondary" id="tie-rate">tie —</div>
    </div>
    <div class="equity-bar idle" id="equity-bar" role="img" aria-label="Equity split">
      <div class="seg-win" id="seg-win" style="width:0%"></div>
      <div class="seg-tie" id="seg-tie" style="width:0%"></div>
    </div>
  </section>

  <section class="advice-panel" id="advice-panel" hidden aria-live="polite">
    <div class="advice-header">
      <div>
        <div class="advice-kicker" data-i18n="strategyAdvice">Strategy advice</div>
        <div class="advice-status" id="advice-status">—</div>
      </div>
      <div class="advice-confidence" id="advice-confidence">—</div>
    </div>
    <div class="advice-badges" id="advice-badges"></div>
    <div class="advice-hero" id="advice-hero"></div>
    <div class="advice-actions" id="advice-actions"></div>
    <div class="advice-message" id="advice-message"></div>
    <details class="advice-evidence" id="advice-evidence">
      <summary data-i18n="detailsEvidence">Details and evidence</summary>
      <dl class="advice-meta" id="advice-meta"></dl>
      <div id="advice-evidence-content"></div>
    </details>
  </section>

  <section class="confidence-panel" aria-label="Recognition confidence">
    <div class="confidence-overall">
      <span class="badge" id="confidence-badge" aria-hidden="true"></span>
      <span id="confidence-value">confidence —</span>
    </div>
    <div class="confidence-fields" id="confidence-fields"></div>
  </section>

  <footer class="footer">
    <span id="footer-left">frame —</span>
    <span id="footer-right">—</span>
  </footer>
</main>

<dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
  <form method="dialog">
    <div class="settings-title-row">
      <h1 id="settings-title" data-i18n="settings">Settings</h1>
      <button class="dialog-close control" id="settings-close" type="submit" aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <label class="language-label" for="language-select" data-i18n="language">Language</label>
    <select id="language-select">
      <option value="auto" data-i18n="languageAuto">System default</option>
      <option value="zh">简体中文</option>
      <option value="en">English</option>
    </select>
    <p class="settings-note" data-i18n="languageHint">Changes are saved automatically.</p>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
