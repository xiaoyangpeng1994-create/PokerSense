name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev,perceptual,desktop]"

      - name: pytest
        run: python -m pytest -q

      - name: flake8
        run: python -m flake8 src tests tools
