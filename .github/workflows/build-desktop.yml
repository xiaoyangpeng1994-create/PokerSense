name: Build Desktop App

# Builds the PyInstaller desktop shell for macOS (.dmg, via create-dmg) and
# Windows (a proper installer .exe, via Inno Setup).
#
# Runs on every push to main (so build breakage is caught immediately) and
# can be triggered manually. Tag pushes (v*) additionally attach the built
# artifacts to a GitHub Release.
#
# macOS code signing + notarization (optional): only runs if the
# MACOS_CERTIFICATE secret is set. To enable it, add these repo secrets
# (Settings -> Secrets and variables -> Actions):
#   MACOS_CERTIFICATE          base64 of your Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD      password for that .p12
#   MACOS_SIGNING_IDENTITY     e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_API_KEY_ID           App Store Connect API key ID
#   APPLE_API_ISSUER           App Store Connect API issuer ID
#   APPLE_API_KEY               contents of the AuthKey_XXXX.p8 file
# Without these secrets, the workflow still runs and produces an unsigned
# build (fine for local testing; macOS will show a Gatekeeper warning on
# first launch of an unsigned/un-notarized app).
#
# Windows code signing is not wired up yet (no certificate configured) --
# the .exe is unsigned, so Windows SmartScreen will warn on first run.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # `secrets` is not accessible directly inside `if:` expressions; expose
    # it as a job-level env var once and gate on `env.*` in each step's `if:`.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -e ".[desktop,perceptual,packaging]"

      - name: Build .app
        run: |
          pyinstaller packaging/pokersense.spec --distpath dist --workpath build --noconfirm

      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PWD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm cert.p12

      - name: Codesign + notarize
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          codesign --deep --force --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" dist/PokerSense.app

          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY" > ~/private_keys/"AuthKey_${APPLE_API_KEY_ID}.p8"

          # Notarization wants a zip/dmg of the .app, not the .app itself.
          # The stapled ticket ends up on the .app; the DMG built below just
          # carries that already-stapled .app.
          ditto -c -k --keepParent dist/PokerSense.app dist/notarize-submission.zip
          xcrun notarytool submit dist/notarize-submission.zip \
            --key ~/private_keys/"AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple dist/PokerSense.app
          rm -f dist/notarize-submission.zip

      - name: Build .dmg
        run: |
          brew install create-dmg
          # create-dmg's Finder-styling AppleScript step is known to exit
          # non-zero on headless CI runners even when the dmg is built fine
          # -- check for the actual output file, not the exit code.
          create-dmg \
            --volname "PokerSense" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "PokerSense.app" 175 190 \
            --hide-extension "PokerSense.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            dist/PokerSense-macos.dmg \
            dist/PokerSense.app || true
          test -f dist/PokerSense-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PokerSense-macos
          path: dist/PokerSense-macos.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[desktop,perceptual,packaging]"

      - name: Verify Windows capture dependency
        run: python -c "import mss; print(mss.__version__)"

      - name: Build .exe
        run: pyinstaller packaging/pokersense.spec --distpath dist --workpath build --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        # choco installs ISCC.exe to Program Files but doesn't reliably put
        # it on PATH within the same job -- call it by its known location.
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\pokersense.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: PokerSense-windows
          path: dist/PokerSense-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PokerSense-macos/PokerSense-macos.dmg
            artifacts/PokerSense-windows/PokerSense-Setup.exe
